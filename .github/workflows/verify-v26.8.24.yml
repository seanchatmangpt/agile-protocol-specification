name: Verify APS v26.8.24 Whole Repository

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aps-v26.8.24-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Establish exact-head coordinate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "APS_SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Compile verifier and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/verify.py tools/verify_ggen_ecosystem.py tools/simulate_fortune500.py tests/*.py

      - name: Install pinned semantic qualification stack
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r tools/requirements-ci.txt

      - name: Qualify whole repository and multi-cell ggen contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify.py --receipt /tmp/aps-repository-receipt.json
          python3 tools/verify_ggen_ecosystem.py | tee /tmp/aps-ggen-static-court.json
          python3 -m unittest discover -s tests -v

      - name: Load exact ggen ecosystem coordinates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          lock = json.loads(Path('specification-guide/manufacturing/ecosystem.lock.json').read_text())
          g = lock['ggen']
          m = lock['marketplace']
          print(f"GGEN_VERSION={g['version']}")
          print(f"GGEN_COMMIT={g['commit']}")
          print(f"GGEN_RELEASE_TAG={g['releaseTag']}")
          print(f"GGEN_ASSET={g['asset']}")
          print(f"GGEN_ASSET_SHA256={g['assetSha256']}")
          print(f"GGEN_MARKETPLACE_COMMIT={m['commit']}")
          PY

      - name: Resolve and verify exact ggen ecosystem
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/ggen-release"
          market_dir="$RUNNER_TEMP/ggen-marketplace"
          mkdir -p "$release_dir" "$market_dir"

          asset="$RUNNER_TEMP/$GGEN_ASSET"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/seanchatmangpt/ggen/releases/download/$GGEN_RELEASE_TAG/$GGEN_ASSET" \
            -o "$asset"
          echo "$GGEN_ASSET_SHA256  $asset" | sha256sum -c -
          tar -xzf "$asset" -C "$release_dir"
          ggen_bin="$(find "$release_dir" -type f -name ggen | head -n 1)"
          test -n "$ggen_bin"
          chmod +x "$ggen_bin"
          "$ggen_bin" --version | tee /tmp/aps-ggen-version.txt
          grep -F "$GGEN_VERSION" /tmp/aps-ggen-version.txt
          echo "GGEN_BIN=$ggen_bin" >> "$GITHUB_ENV"

          git -C "$market_dir" init -q
          git -C "$market_dir" remote add origin https://github.com/seanchatmangpt/ggen-marketplace.git
          git -C "$market_dir" fetch -q --depth 1 origin "$GGEN_MARKETPLACE_COMMIT"
          git -C "$market_dir" checkout -q --detach FETCH_HEAD
          test "$(git -C "$market_dir" rev-parse HEAD)" = "$GGEN_MARKETPLACE_COMMIT"
          export GGEN_MARKETPLACE_ROOT="$market_dir"
          echo "GGEN_MARKETPLACE_ROOT=$GGEN_MARKETPLACE_ROOT" >> "$GITHUB_ENV"

          python3 - <<'PY' > /tmp/aps-expected-pack-blobs.tsv
          import json
          from pathlib import Path
          lock = json.loads(Path('specification-guide/manufacturing/ecosystem.lock.json').read_text())
          for pack, meta in sorted(lock['marketplace']['packs'].items()):
              for path, sha in sorted(meta['blobs'].items()):
                  print(pack, sha, path, sep='\t')
          PY
          while IFS=$'\t' read -r pack expected path; do
            actual="$(git -C "$market_dir" hash-object "packs/$pack/$path")"
            test "$actual" = "$expected"
          done < /tmp/aps-expected-pack-blobs.tsv

          python3 - <<'PY'
          import json, os, tomllib
          from pathlib import Path
          lock = json.loads(Path('specification-guide/manufacturing/ecosystem.lock.json').read_text())
          root = Path(os.environ['GGEN_MARKETPLACE_ROOT']) / 'packs'
          for name, meta in lock['marketplace']['packs'].items():
              actual = tomllib.loads((root / name / 'pack.toml').read_text())['pack']['version']
              assert actual == meta['version'], (name, actual, meta['version'])
          PY

      - name: Manufacture APS mdBook control surface
        shell: bash
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/aps-ggen-mdbook"
          evidence="/tmp/aps-ggen-evidence/mdbook"
          rm -rf "$consumer" "$evidence"
          mkdir -p "$consumer" "$evidence"
          cp -R specification-guide/manufacturing/. "$consumer/"
          mkdir -p "$consumer/packs" "$consumer/templates"
          cp -R "$GGEN_MARKETPLACE_ROOT/packs/mdbook-pattern-language-pack" "$consumer/packs/"

          cd "$consumer"
          "$GGEN_BIN" sync run
          cp docs/SUMMARY.md "$evidence/SUMMARY.pass1.md"
          cp book.toml "$evidence/book.pass1.toml"
          "$GGEN_BIN" receipt verify | tee "$evidence/receipt-verify-pass1.txt"
          "$GGEN_BIN" sync run
          "$GGEN_BIN" receipt verify | tee "$evidence/receipt-verify-pass2.txt"
          cmp "$evidence/SUMMARY.pass1.md" docs/SUMMARY.md
          cmp "$evidence/book.pass1.toml" book.toml
          cmp docs/SUMMARY.md "$GITHUB_WORKSPACE/specification-guide/src/SUMMARY.md"

          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          generated = tomllib.loads(Path('book.toml').read_text())
          committed = tomllib.loads(Path(os.environ['GITHUB_WORKSPACE'], 'specification-guide', 'book.toml').read_text())
          for key in ('title', 'authors', 'description', 'language', 'src'):
              assert generated['book'][key] == committed['book'][key], key
          for key in ('build-dir', 'create-missing'):
              assert generated['build'][key] == committed['build'][key], key
          PY
          cp docs/SUMMARY.md "$evidence/SUMMARY.manufactured.md"
          cp book.toml "$evidence/book.manufactured.toml"

      - name: Manufacture consequence and evidentiary-standing cells
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="/tmp/aps-ggen-evidence/cells"
          mkdir -p "$evidence_root"

          manufacture_pack_cell() {
            cell="$1"
            pack="$2"
            output="$3"
            consumer="$RUNNER_TEMP/aps-ggen-$cell"
            evidence="$evidence_root/$cell"
            rm -rf "$consumer" "$evidence"
            mkdir -p "$consumer" "$consumer/packs" "$consumer/templates" "$evidence"
            cp -R "$GITHUB_WORKSPACE/specification-guide/manufacturing/cells/$cell/." "$consumer/"
            cp -R "$GGEN_MARKETPLACE_ROOT/packs/$pack" "$consumer/packs/"
            cd "$consumer"
            "$GGEN_BIN" sync run
            test -s "$output"
            mkdir -p "$evidence/pass1/$(dirname "$output")"
            cp "$output" "$evidence/pass1/$output"
            "$GGEN_BIN" receipt verify | tee "$evidence/receipt-verify-pass1.txt"
            "$GGEN_BIN" sync run
            "$GGEN_BIN" receipt verify | tee "$evidence/receipt-verify-pass2.txt"
            cmp "$evidence/pass1/$output" "$output"
            mkdir -p "$evidence/manufactured/$(dirname "$output")"
            cp "$output" "$evidence/manufactured/$output"
          }

          manufacture_pack_cell consequence consequence-ir-pack docs/CONSEQUENCE_IR_ADMITTED.md
          manufacture_pack_cell standing standing-ladder-pack docs/standing-ladder/audit-trail.md

      - name: Manufacture APS DfCM maximalist option court
        shell: bash
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/aps-ggen-dfcm"
          evidence="/tmp/aps-ggen-evidence/cells/dfcm"
          rm -rf "$consumer" "$evidence"
          mkdir -p "$consumer" "$evidence/pass1" "$evidence/manufactured"
          cp -R "$GGEN_MARKETPLACE_ROOT/packs/dfcm-maximalist-court-pack/." "$consumer/"
          cp "$GITHUB_WORKSPACE/specification-guide/manufacturing/cells/dfcm/ontology.ttl" "$consumer/ontology.ttl"
          rm -rf "$consumer/consumer/dfcm-court"

          cd "$consumer"
          "$GGEN_BIN" sync run
          "$GGEN_BIN" receipt verify | tee "$evidence/receipt-verify-pass1.txt"
          for file in candidates.json qualification.json select.json; do
            test -s "consumer/dfcm-court/$file"
            cp "consumer/dfcm-court/$file" "$evidence/pass1/$file"
          done

          "$GGEN_BIN" sync run
          "$GGEN_BIN" receipt verify | tee "$evidence/receipt-verify-pass2.txt"
          for file in candidates.json qualification.json select.json; do
            cmp "$evidence/pass1/$file" "consumer/dfcm-court/$file"
            cp "consumer/dfcm-court/$file" "$evidence/manufactured/$file"
          done

          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('consumer/dfcm-court')
          candidates = json.loads((root / 'candidates.json').read_text())
          qualification = json.loads((root / 'qualification.json').read_text())
          selection = json.loads((root / 'select.json').read_text())
          def rows(value):
              if isinstance(value, list): return value
              if isinstance(value, dict):
                  for key in ('candidates', 'rows', 'items', 'qualification', 'select'):
                      if isinstance(value.get(key), list): return value[key]
              raise AssertionError(f'unrecognized generated court shape: {type(value)} {value!r}')
          assert len(rows(candidates)) == 5, candidates
          assert len(rows(qualification)) == 5, qualification
          assert 3 <= len(rows(selection)) < 5, selection
          PY

      - name: Write multi-cell manufacture evidence
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/aps-ggen-version.txt /tmp/aps-ggen-evidence/ggen-version.txt
          python3 - <<'PY' > /tmp/aps-ggen-evidence/manufacture.json
          import hashlib, json, os
          from pathlib import Path
          root = Path('/tmp/aps-ggen-evidence')
          lock = json.loads(Path('specification-guide/manufacturing/ecosystem.lock.json').read_text())
          files = sorted(p for p in root.rglob('*') if p.is_file() and p.name != 'manufacture.json')
          print(json.dumps({
              'schema': 'aps.ggen-multi-cell-manufacture-evidence.v26.8.24.2',
              'standing': 'ALIVE',
              'apsHead': os.environ['APS_SOURCE_REVISION'],
              'ggen': lock['ggen'],
              'marketplace': {'commit': lock['marketplace']['commit'], 'packs': sorted(lock['marketplace']['packs'])},
              'cells': ['mdbook', 'consequence', 'standing', 'dfcm'],
              'artifacts': {
                  str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in files
              },
              'claims': [
                  'Four specialized ggen manufacturing cells executed at this exact APS head.',
                  'Critical marketplace pack surfaces matched the exact Git blob datum.',
                  'Every executed cell reached a deterministic second-manufacture fixed point.',
                  'ggen receipt verification passed after each manufacture and replay.',
                  'The DfCM court preserved multiple selectable and deliberately unselected options.'
              ],
              'nonClaims': [
                  'This does not prove complete APS self-hosting.',
                  'MANUFACTURED evidentiary standing is not production ACTUATED or VERIFIED standing.',
                  'DfCM SELECT does not grant DO authority.',
                  'No cell grants production actuation authority.'
              ]
          }, indent=2, sort_keys=True))
          PY

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08
        with:
          mdbook-version: '0.5.4'

      - name: Build active specification projection
        shell: bash
        run: |
          set -euo pipefail
          mdbook build -d /tmp/aps-book specification-guide
          test -s /tmp/aps-book/index.html

      - name: Execute synthetic Fortune-500 sensitivity model
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/simulate_fortune500.py \
            examples/fortune500-fibo/enterprise.json \
            --receipt /tmp/aps-f500-sensitivity.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('/tmp/aps-f500-sensitivity.json').read_text())
          assert r['standing'] == 'ALIVE', r
          assert r['evidenceClass'] == 'SYNTHETIC_SENSITIVITY_MODEL_NOT_FORECAST', r
          PY

      - name: Assert qualification is read-only on repository
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: APS-v26.8.24-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/aps-repository-receipt.json
            /tmp/aps-ggen-static-court.json
            /tmp/aps-f500-sensitivity.json
            /tmp/aps-ggen-evidence/**
          if-no-files-found: warn
          retention-days: 30
