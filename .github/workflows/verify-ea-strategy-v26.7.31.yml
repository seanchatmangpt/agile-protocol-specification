name: Verify APS Enterprise Architecture as Strategy

on:
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "specification-guide/src/SUMMARY.md"
      - "specification-guide/src/v26_7_30/17_enterprise_architecture_as_strategy.md"
      - "specification-guide/src/v26_7_30/ea_strategy/**"
      - "specification-guide/standards/ggen-enterprise-architecture-v26.7.31.json"
      - "specification-guide/scripts/verify_ea_strategy_v26_7_31.py"
      - "receipts/APS-v26.7.31-ggen-enterprise-architecture.json"
      - ".github/workflows/verify-ea-strategy-v26.7.31.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "specification-guide/src/SUMMARY.md"
      - "specification-guide/src/v26_7_30/17_enterprise_architecture_as_strategy.md"
      - "specification-guide/src/v26_7_30/ea_strategy/**"
      - "specification-guide/standards/ggen-enterprise-architecture-v26.7.31.json"
      - "specification-guide/scripts/verify_ea_strategy_v26_7_31.py"
      - "receipts/APS-v26.7.31-ggen-enterprise-architecture.json"
      - ".github/workflows/verify-ea-strategy-v26.7.31.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aps-ea-strategy-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Replay committed deterministic receipt
        shell: bash
        run: |
          set -euo pipefail
          cp receipts/APS-v26.7.31-ggen-enterprise-architecture.json /tmp/expected-ea-receipt.json
          python3 -m py_compile specification-guide/scripts/verify_ea_strategy_v26_7_31.py
          python3 specification-guide/scripts/verify_ea_strategy_v26_7_31.py
          cmp /tmp/expected-ea-receipt.json receipts/APS-v26.7.31-ggen-enterprise-architecture.json
      - name: Verify Stage 5 fence and proof cardinality
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          profile = json.loads(Path("specification-guide/standards/ggen-enterprise-architecture-v26.7.31.json").read_text())
          assert profile["rwr_fence"]["ggen_extension"]["is_original_rwr_stage"] is False
          assert len(profile["dimensions"]) == 21
          assert sum(len(item["proof_obligations"]) for item in profile["dimensions"]) == 63
          assert profile["maturity"]["level_5"]["conjunctive"] is True
          assert profile["actuation"]["direct_actuation_allowed"] is False
          assert profile["actuation"]["exclusive_path"] == "BRCE"
          assert profile["building_blocks"]["accepted_cli_aliases"]["gpc"] == "GCP"
          PY
      - name: Upload verifier receipt
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: APS-v26.7.31-enterprise-architecture-${{ github.event.pull_request.head.sha || github.sha }}
          path: receipts/APS-v26.7.31-ggen-enterprise-architecture.json
          if-no-files-found: error
          retention-days: 30
