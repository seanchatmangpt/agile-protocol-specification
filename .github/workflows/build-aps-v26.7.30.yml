name: Build APS v26.7.30 book and PDF

on:
  push:
    branches:
      - agent/aps-v26.7.30-phd-book
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aps-v26.7.30-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Materialize the admitted v26.7.30 source tree
        shell: bash
        run: |
          set -euo pipefail
          compgen -G '.aps-bootstrap/aps-v26.7.30.tar.gz.b64.part-*' >/dev/null
          cat .aps-bootstrap/aps-v26.7.30.tar.gz.b64.part-* > /tmp/aps-v26.7.30.tar.gz.b64
          base64 --decode /tmp/aps-v26.7.30.tar.gz.b64 > /tmp/aps-v26.7.30.tar.gz
          echo '873f0c80a35a43ef6b914a11d92ff8a42d1cff58ef4bf8acb53f1a65ad18963e  /tmp/aps-v26.7.30.tar.gz' | sha256sum -c -
          tar -xzf /tmp/aps-v26.7.30.tar.gz -C .
          sed -i '/^multilingual = false$/d' specification-guide/book.toml
          rm -rf .aps-bootstrap

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo installation
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: aps-mdbook-${{ runner.os }}-0.5.4-pdf-0.1.13

      - name: Compile mdBook and PDF backend with Cargo
        shell: bash
        run: |
          set -euo pipefail
          command -v mdbook >/dev/null || cargo install mdbook --version 0.5.4 --locked
          command -v mdbook-pdf >/dev/null || cargo install mdbook-pdf --version 0.1.13 --locked
          rustc -Vv
          cargo -V
          mdbook --version
          mdbook-pdf --version || true

      - name: Install PDF verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          chrome=$(command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          test -n "$chrome"
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"

      - name: Expose mdBook renderer diagnostics
        working-directory: specification-guide
        shell: bash
        run: |
          set -o pipefail
          rm -rf book
          mdbook build 2>&1 | tee /tmp/aps-mdbook-build.log

      - name: Verify source candidate
        run: python3 specification-guide/scripts/verify_v26_7_30.py

      - name: Build HTML and PDF with Rust mdBook
        working-directory: specification-guide
        run: |
          set -euo pipefail
          rm -rf book
          mdbook build
          test -s book/html/print.html
          test -s book/pdf/output.pdf
          mkdir -p dist
          cp book/pdf/output.pdf dist/APS-v26.7.30.pdf

      - name: Validate and render PDF witnesses
        shell: bash
        run: |
          set -euo pipefail
          pdf=specification-guide/dist/APS-v26.7.30.pdf
          test "$(head -c 4 "$pdf")" = "%PDF"
          pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
          bytes=$(stat -c '%s' "$pdf")
          test "$pages" -ge 25
          test "$bytes" -ge 250000
          mkdir -p /tmp/aps-pdf-witness
          pdftoppm -f 1 -singlefile -png -r 120 "$pdf" /tmp/aps-pdf-witness/first
          pdftoppm -f "$pages" -singlefile -png -r 120 "$pdf" /tmp/aps-pdf-witness/last
          test -s /tmp/aps-pdf-witness/first.png
          test -s /tmp/aps-pdf-witness/last.png
          sha=$(sha256sum "$pdf" | awk '{print $1}')
          rustc_version=$(rustc --version)
          cargo_version=$(cargo --version)
          mdbook_version=$(mdbook --version)
          mdbook_pdf_version=$(mdbook-pdf --version 2>&1 | head -1 || true)
          python3 - "$sha" "$pages" "$bytes" "$rustc_version" "$cargo_version" "$mdbook_version" "$mdbook_pdf_version" <<'PY'
          import json, pathlib, sys
          sha, pages, size, rustc, cargo, mdbook, mdbook_pdf = sys.argv[1:]
          receipt = {
              "schema": "aps.rust-book-build.v26.7.30",
              "standing": "ALIVE",
              "repository": "seanchatmangpt/agile-protocol-specification",
              "revision": "GITHUB_SHA_PENDING_GENERATED_COMMIT",
              "source_command": "python3 specification-guide/scripts/verify_v26_7_30.py",
              "build_command": "mdbook build",
              "toolchain": {
                  "rustc": rustc,
                  "cargo": cargo,
                  "mdbook": mdbook,
                  "mdbook_pdf": mdbook_pdf,
                  "renderer": "Chromium via mdbook-pdf"
              },
              "outputs": {
                  "html": "specification-guide/book/html/print.html",
                  "pdf": "specification-guide/dist/APS-v26.7.30.pdf",
                  "pdf_sha256": sha,
                  "pdf_pages": int(pages),
                  "pdf_bytes": int(size),
                  "render_witnesses": ["first-page PNG", "last-page PNG"]
              },
              "nonclaims": [
                  "ALIVE is bounded to the recorded source, build, structural PDF, and render-witness checks",
                  "visual inspection outside the rendered witness pages is not claimed",
                  "downstream Gall checkpoint execution is not claimed"
              ],
              "replay": [
                  "python3 specification-guide/scripts/verify_v26_7_30.py",
                  "cd specification-guide && mdbook build",
                  "pdfinfo specification-guide/dist/APS-v26.7.30.pdf"
              ]
          }
          path = pathlib.Path("receipts/APS-v26.7.30-rust-build.json")
          path.write_text(json.dumps(receipt, indent=2) + "\n")
          PY

      - name: Commit compiled book, PDF, and build receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Compiled outputs already match the branch."
            exit 0
          fi
          git commit -m "Compile APS v26.7.30 book and PDF [skip ci]"
          git push

      - name: Upload compiled artifact
        uses: actions/upload-artifact@v4
        with:
          name: APS-v26.7.30
          path: |
            specification-guide/dist/APS-v26.7.30.pdf
            receipts/APS-v26.7.30-rust-build.json
          if-no-files-found: error
          retention-days: 30
