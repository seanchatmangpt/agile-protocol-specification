name: Converge APS v26.7.31 Fortune-5 SAFe and ggen

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aps-v26.7.31-convergence-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Establish canonical source coordinate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .aps-enterprise-bootstrap
          rm -f .github/workflows/publish-aps-v26.7.30.yml
          test -s simulation/fortune5-safe/Cargo.toml
          test -s simulation/fortune5-safe/src/main.rs
          test -s specification-guide/src/v26_7_30/16_ai_native_operating_model.md
          test -s specification-guide/src/v26_7_30/16_ggen_manufacturing_standard.md
          test -s specification-guide/standards/ggen-v26.7.62.json
          test -s specification-guide/scripts/verify_ggen_v26_7_31.py
          test -s specification-guide/scripts/verify_v26_7_30.py
          grep -q '16_ai_native_operating_model.md' specification-guide/src/SUMMARY.md
          grep -q '16_ggen_manufacturing_standard.md' specification-guide/src/SUMMARY.md
          grep -q 'AI-Native' specification-guide/src/v26_7_30/16_ai_native_operating_model.md
          grep -q 'MCP' specification-guide/src/v26_7_30/15_mcp_a2a_safe_simulation.md
          grep -q 'A2A' specification-guide/src/v26_7_30/15_mcp_a2a_safe_simulation.md
          chapter_count=$(grep -cE '^[-*] \[[^]]+\]\([^)]+\.md\)' specification-guide/src/SUMMARY.md)
          test "$chapter_count" -eq 18
          echo "APS_SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc -Vv
          cargo -V

      - name: Verify Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path simulation/fortune5-safe/Cargo.toml --all -- --check
          cargo test --manifest-path simulation/fortune5-safe/Cargo.toml --locked --all-targets
          cargo clippy --manifest-path simulation/fortune5-safe/Cargo.toml --locked --all-targets -- -D warnings
          cargo build --release --manifest-path simulation/fortune5-safe/Cargo.toml --locked

      - name: Exercise full-scale simulation and deterministic replay
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release --manifest-path simulation/fortune5-safe/Cargo.toml --locked -p safe-simulator --example full_sim -- --seed 42 | tee /tmp/APS-v26.7.31-f5-simulation.log
          cargo run --release --manifest-path simulation/fortune5-safe/Cargo.toml --locked -p safe-verifier --bin verifier -- --seed 42 --assert-invariants | tee /tmp/APS-v26.7.31-f5-verifier.log
          test -s simulation/fortune5-safe/receipts/run-a.json
          test -s simulation/fortune5-safe/receipts/run-b.json
          cmp simulation/fortune5-safe/receipts/run-a.json simulation/fortune5-safe/receipts/run-b.json
          test -s simulation/fortune5-safe/receipts/verifier-report.json

      - name: Verify APS and ggen canonical profiles
        shell: bash
        run: |
          set -euo pipefail
          python3 specification-guide/scripts/verify_ggen_v26_7_31.py
          python3 specification-guide/scripts/verify_v26_7_30.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          profile = json.loads(Path("specification-guide/standards/ggen-v26.7.62.json").read_text())
          assert profile["source"]["revision"] == "68952593c40214ac1a681073d65f3902a9cdfce4"
          assert profile["authority"]["canonical_authority"] == "ontology"
          assert profile["authority"]["generated_outputs_are_authority"] is False
          assert profile["actuation"]["direct_actuation_allowed"] is False
          assert profile["receipt"]["ggen_algorithm"] == "BLAKE3"
          assert profile["replay"]["refusal_precedence"][0] == "DuplicateReplay"
          PY

      - name: Install publication dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v mdbook >/dev/null || cargo install mdbook --version 0.5.4 --locked
          command -v mdbook-pdf >/dev/null || cargo install mdbook-pdf --version 0.1.13 --locked
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          chrome=$(command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          test -n "$chrome"
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          mdbook --version

      - name: Compile and validate the 18-chapter book
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^multilingual = false$/d' specification-guide/book.toml
          rm -rf specification-guide/book
          mdbook build specification-guide 2>&1 | tee /tmp/APS-v26.7.31-mdbook-build.log
          test -s specification-guide/book/html/print.html
          test -s specification-guide/book/pdf/output.pdf
          mkdir -p specification-guide/dist
          cp specification-guide/book/pdf/output.pdf specification-guide/dist/APS-v26.7.31.pdf
          pdf=specification-guide/dist/APS-v26.7.31.pdf
          test "$(head -c 4 "$pdf")" = '%PDF'
          pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
          bytes=$(stat -c '%s' "$pdf")
          test "$pages" -ge 25
          test "$bytes" -ge 250000
          echo "APS_PDF_PAGES=$pages" >> "$GITHUB_ENV"
          echo "APS_PDF_BYTES=$bytes" >> "$GITHUB_ENV"

      - name: Manufacture exact-head publication receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          pdf = Path("specification-guide/dist/APS-v26.7.31.pdf")
          evidence_paths = [
              Path("simulation/fortune5-safe/receipts/run-a.json"),
              Path("simulation/fortune5-safe/receipts/run-b.json"),
              Path("simulation/fortune5-safe/receipts/verifier-report.json"),
              Path("receipts/APS-v26.7.30-verifier.json"),
              Path("receipts/APS-v26.7.31-ggen-standard.json"),
          ]
          evidence = {
              str(path): {
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "bytes": path.stat().st_size,
              }
              for path in evidence_paths
          }
          receipt = {
              "schema": "aps.fortune5-safe-ggen-publication.receipt.v26.7.31",
              "standing": "ALIVE",
              "subject": os.environ["APS_SOURCE_REVISION"],
              "chapters": 18,
              "ggen": {
                  "release": "26.7.62",
                  "sourceRevision": "68952593c40214ac1a681073d65f3902a9cdfce4",
                  "directActuationAllowed": False,
                  "executionReceiptAlgorithm": "BLAKE3",
              },
              "toolchain": {
                  "rustc": subprocess.check_output(["rustc", "--version"], text=True).strip(),
                  "cargo": subprocess.check_output(["cargo", "--version"], text=True).strip(),
                  "python": subprocess.check_output(["python3", "--version"], text=True).strip(),
                  "mdbook": subprocess.check_output(["mdbook", "--version"], text=True).strip(),
                  "mdbookPdf": "0.1.13",
              },
              "evidence": evidence,
              "pdf": {
                  "path": str(pdf),
                  "sha256": hashlib.sha256(pdf.read_bytes()).hexdigest(),
                  "pages": int(os.environ["APS_PDF_PAGES"]),
                  "bytes": int(os.environ["APS_PDF_BYTES"]),
              },
              "zeroUnreceiptedActuation": True,
              "nonclaims": [
                  "No production MCP, A2A, ggen, or BRCE endpoint was deployed.",
                  "APS profile conformance does not claim the ggen implementation executed in this repository.",
                  "Simulation standing does not grant production authority.",
              ],
              "replay": [
                  "cargo test --manifest-path simulation/fortune5-safe/Cargo.toml --locked --all-targets",
                  "python3 specification-guide/scripts/verify_ggen_v26_7_31.py",
                  "python3 specification-guide/scripts/verify_v26_7_30.py",
                  "mdbook build specification-guide",
              ],
          }
          Path("receipts").mkdir(exist_ok=True)
          Path("receipts/APS-v26.7.31-fortune5-safe-ggen-publication.json").write_text(
              json.dumps(receipt, indent=2) + "\n"
          )
          PY

      - name: Commit generated publication surfaces
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          test -n "$TARGET_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specification-guide/book specification-guide/dist receipts
          git diff --cached --quiet && exit 0
          git commit -m 'Publish APS v26.7.31 ggen-aligned book and receipts'
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: APS-v26.7.31-fortune5-safe-ggen-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            specification-guide/dist/APS-v26.7.31.pdf
            receipts/APS-v26.7.31-*.json
            receipts/APS-v26.7.30-verifier.json
            simulation/fortune5-safe/receipts/*.json
            /tmp/APS-v26.7.31-*.log
          if-no-files-found: warn
          retention-days: 30
