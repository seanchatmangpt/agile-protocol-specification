name: Verify Fortune-5 SAFe MCP A2A Simulation

on:
  pull_request:
    branches:
      - main
    paths:
      - "simulation/fortune5-safe/**"
      - "specification-guide/src/v26_7_30/15_mcp_a2a_safe_simulation.md"
      - "specification-guide/src/v26_7_30/10_tools_automation.md"
      - "specification-guide/src/SUMMARY.md"
      - "specification-guide/examples/aps_v26_7_30_mcp_a2a_safe_work_order.json"
      - ".github/workflows/verify-fortune5-safe-sim.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fortune5-safe-sim-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}

      - name: Admit digest-pinned simulation source
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G '.aps-safe-bootstrap/fortune5-safe.tar.gz.b64.part-*' >/dev/null; then
            cat .aps-safe-bootstrap/fortune5-safe.tar.gz.b64.part-* > /tmp/fortune5-safe.tar.gz.b64
            base64 --decode /tmp/fortune5-safe.tar.gz.b64 > /tmp/fortune5-safe.tar.gz
            echo 'a54e95388c0ec80ec1bdbb1341b5aea64b558d6aaff5e84056e6bffbd4ef677e  /tmp/fortune5-safe.tar.gz' | sha256sum -c -
            tar -xzf /tmp/fortune5-safe.tar.gz -C .
            rm -rf .aps-safe-bootstrap
          fi
          test -s simulation/fortune5-safe/Cargo.toml
          test -s simulation/fortune5-safe/src/main.rs
          test -s simulation/fortune5-safe/scripts/verify.py

      - name: Repair admitted source laws
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          autonomics = Path('simulation/fortune5-safe/src/autonomics.rs')
          source = autonomics.read_text()
          pattern = r"    let blocked_ratio_basis_points = if metrics\.active_features == 0 \{\n\s*0\n\s*\} else \{\n\s*metrics\.blocked_features\.saturating_mul\(10_000\) / metrics\.active_features\n\s*\};"
          replacement = """    let blocked_ratio_basis_points = metrics
              .blocked_features
              .saturating_mul(10_000)
              .checked_div(metrics.active_features)
              .unwrap_or(0);"""
          source, count = re.subn(pattern, replacement, source)
          if count != 1:
              raise SystemExit(f'AUTONOMICS_CHECKED_DIVISION_PATCH_REFUSED:{count}')
          autonomics.write_text(source)

          engine = Path('simulation/fortune5-safe/src/engine.rs')
          source = engine.read_text()
          pattern = r"                let blocked_ratio = if self\.metrics\.active_features == 0 \{\n\s*0\n\s*\} else \{\n\s*self\.metrics\.blocked_features\.saturating_mul\(100\)\n\s*/ self\.metrics\.active_features\n\s*\};"
          replacement = """                let blocked_ratio = self
                      .metrics
                      .blocked_features
                      .saturating_mul(100)
                      .checked_div(self.metrics.active_features)
                      .unwrap_or(0);"""
          source, count = re.subn(pattern, replacement, source)
          if count != 1:
              raise SystemExit(f'ENGINE_CHECKED_DIVISION_PATCH_REFUSED:{count}')
          engine.write_text(source)

          verifier = Path('simulation/fortune5-safe/scripts/verify.py')
          source = verifier.read_text()
          old = '        "stdout": process.stdout[-4000:],'
          new = '        "stdout": process.stdout if "self-test" in command else process.stdout[-4000:],'
          if source.count(old) != 1:
              raise SystemExit('SELF_TEST_STDOUT_CAPTURE_PATCH_REFUSED')
          source = source.replace(old, new)
          old = '        commands.append(self_test_run)'
          new = '        commands.append({**self_test_run, "stdout": self_test_run["stdout"][-4000:]})'
          if source.count(old) != 1:
              raise SystemExit('SELF_TEST_RECEIPT_BOUND_PATCH_REFUSED')
          verifier.write_text(source.replace(old, new))
          PY

      - name: Install Rust verifier toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: simulation/fortune5-safe

      - name: Canonicalize Rust formatting
        run: cargo fmt --manifest-path simulation/fortune5-safe/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path simulation/fortune5-safe/Cargo.toml --all-targets -- -D warnings

      - name: Unit and integration tests
        run: cargo test --manifest-path simulation/fortune5-safe/Cargo.toml --all-targets

      - name: Verify machinery, autonomics, and replay
        run: python3 simulation/fortune5-safe/scripts/verify.py --require-cargo

      - name: Commit admitted simulation source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A simulation/fortune5-safe .aps-safe-bootstrap
          git diff --cached --quiet && exit 0
          git commit -m "Admit MCP A2A SAFe simulation source [skip ci]"
          git pull --rebase origin agent/aps-v26.7.30-phd-book
          git push origin HEAD:agent/aps-v26.7.30-phd-book

      - name: Upload simulation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APS-v26.7.30-fortune5-safe-sim
          path: simulation/fortune5-safe/target/aps-safe-sim/
          if-no-files-found: warn
          retention-days: 30
