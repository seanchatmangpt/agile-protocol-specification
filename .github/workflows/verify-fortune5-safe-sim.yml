name: Verify Fortune-5 SAFe MCP A2A Simulation

on:
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "simulation/fortune5-safe/**"
      - "specification-guide/src/v26_7_30/15_mcp_a2a_safe_simulation.md"
      - "specification-guide/src/v26_7_30/16_ai_native_operating_model.md"
      - "specification-guide/src/SUMMARY.md"
      - ".github/workflows/verify-fortune5-safe-sim.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "simulation/fortune5-safe/**"
      - "specification-guide/src/v26_7_30/15_mcp_a2a_safe_simulation.md"
      - "specification-guide/src/v26_7_30/16_ai_native_operating_model.md"
      - "specification-guide/src/SUMMARY.md"
      - ".github/workflows/verify-fortune5-safe-sim.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fortune5-safe-sim-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Establish immutable source boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s simulation/fortune5-safe/Cargo.toml
          test -s simulation/fortune5-safe/Cargo.lock
          test -s simulation/fortune5-safe/src/main.rs
          test -s simulation/fortune5-safe/scripts/verify.py
          test ! -e .aps-safe-bootstrap
          echo "APS_SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install Rust verifier toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc -Vv
          cargo -V

      - name: Verify formatting, lint, build, runtime, and replay
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path simulation/fortune5-safe/Cargo.toml --all -- --check
          cargo clippy --manifest-path simulation/fortune5-safe/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path simulation/fortune5-safe/Cargo.toml --locked --all-targets
          cargo build --manifest-path simulation/fortune5-safe/Cargo.toml --locked --all-targets
          python3 simulation/fortune5-safe/scripts/verify.py --require-cargo
          test -s simulation/fortune5-safe/target/aps-safe-sim/verification-receipt.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("simulation/fortune5-safe/target/aps-safe-sim/verification-receipt.json").read_text())
          assert receipt["standing"] == "ALIVE", receipt
          assert not receipt["failures"], receipt["failures"]
          PY

      - name: Assert read-only repository execution
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- . ':!simulation/fortune5-safe/target' ':!target'

      - name: Upload simulation receipts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: APS-v26.7.31-fortune5-safe-sim-${{ github.event.pull_request.head.sha || github.sha }}
          path: simulation/fortune5-safe/target/aps-safe-sim/
          if-no-files-found: error
          retention-days: 30
