name: Verify APS ggen Manufacturing Standard

on:
  pull_request:
    paths:
      - "README.md"
      - "specification-guide/src/SUMMARY.md"
      - "specification-guide/src/v26_7_30/16_ggen_manufacturing_standard.md"
      - "specification-guide/standards/ggen-v26.7.62.json"
      - "specification-guide/scripts/verify_ggen_v26_7_31.py"
      - "specification-guide/scripts/verify_v26_7_30.py"
      - ".github/workflows/verify-ggen-standard.yml"
      - ".github/workflows/converge-fortune5-safe.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "specification-guide/src/SUMMARY.md"
      - "specification-guide/src/v26_7_30/16_ggen_manufacturing_standard.md"
      - "specification-guide/standards/ggen-v26.7.62.json"
      - "specification-guide/scripts/verify_ggen_v26_7_31.py"
      - "specification-guide/scripts/verify_v26_7_30.py"
      - ".github/workflows/verify-ggen-standard.yml"
      - ".github/workflows/converge-fortune5-safe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aps-ggen-standard-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: Exact-head APS and ggen profile verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify focused ggen manufacturing profile
        run: python3 specification-guide/scripts/verify_ggen_v26_7_31.py

      - name: Verify complete APS canonical source
        run: python3 specification-guide/scripts/verify_v26_7_30.py

      - name: Refuse direct actuation and generated authority
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("specification-guide/standards/ggen-v26.7.62.json").read_text())
          assert p["actuation"]["direct_actuation_allowed"] is False
          assert p["authority"]["generated_outputs_are_authority"] is False
          assert p["receipt"]["ggen_algorithm"] == "BLAKE3"
          assert p["replay"]["refusal_precedence"][0] == "DuplicateReplay"
          PY

      - name: Upload verifier receipts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: aps-ggen-standard-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            receipts/APS-v26.7.31-ggen-standard.json
            receipts/APS-v26.7.30-verifier.json
          if-no-files-found: error
          retention-days: 30
