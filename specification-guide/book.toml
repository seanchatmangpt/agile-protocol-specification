[book]
authors = ["Sean Chatman"]
language = "en"
src = "src"
title = "Agile Protocol Specification v26.8.24"
description = "A constitution for public-semantic, evidence-bound knowledge-work reconstitution and autonomic manufacturing."

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "dark"
preferred-dark-theme = "navy"
additional-css = ["theme/aps.css"]

[output.html.print]
enable = true
