[book]
authors = ["Sean Chatman"]
language = "en"
src = "src"
title = "Agile Protocol Specification v26.8.24"
description = "A constitution for knowledge-work remanufacture, executable enterprise architecture, authority, process evidence, and standing."

[build]
build-dir = "book"
create-missing = true

[output.html]
default-theme = "dark"
preferred-dark-theme = "navy"
additional-css = ["theme/aps.css"]

[output.html.print]
enable = true
