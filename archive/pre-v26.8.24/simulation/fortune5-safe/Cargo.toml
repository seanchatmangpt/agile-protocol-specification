[package]
name = "aps-fortune5-safe-sim"
version = "26.7.30"
edition = "2024"
license = "MIT"
description = "Deterministic APS simulation of a Fortune-5-scale SAFe enterprise using MCP and A2A protocol profiles"
publish = false

[lib]
name = "aps_fortune5_safe_sim"
path = "src/lib.rs"

[[bin]]
name = "aps-safe-sim"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
