[book]
authors = ["Sean Chatman"]
language = "en"
src = "src"
title = "Agile Protocol Specification v26.7.31"
description = "A normative operating constitution for deterministic, evidence-bound human and agentic delivery."

[build]
build-dir = "book"
create-missing = true

[output.html]
default-theme = "dark"
preferred-dark-theme = "navy"
additional-css = ["theme/aps.css"]

[output.html.print]
enable = true

[output.pdf]
