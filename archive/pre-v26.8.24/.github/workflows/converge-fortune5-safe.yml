name: Converge APS v26.7.31 Fortune-5 SAFe, ggen, and EA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aps-v26.7.31-convergence-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify-and-publish-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Establish immutable source coordinate
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .aps-bootstrap
          test ! -e .aps-safe-bootstrap
          test ! -e .aps-enterprise-bootstrap
          test ! -e .github/workflows/publish-aps-v26.7.30.yml
          test -s .aps-syntax.md
          test -s simulation/fortune5-safe/Cargo.toml
          test -s simulation/fortune5-safe/Cargo.lock
          test -s specification-guide/src/v26_7_30/16_ggen_manufacturing_standard.md
          test -s specification-guide/src/v26_7_30/17_enterprise_architecture_as_strategy.md
          test -s specification-guide/standards/ggen-v26.7.62.json
          test -s specification-guide/standards/ggen-enterprise-architecture-v26.7.31.json
          echo "APS_SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Install Rust verification toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc -Vv
          cargo -V
      - name: Verify Fortune-5 runtime and replay
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path simulation/fortune5-safe/Cargo.toml --all -- --check
          cargo clippy --manifest-path simulation/fortune5-safe/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path simulation/fortune5-safe/Cargo.toml --locked --all-targets
          cargo build --manifest-path simulation/fortune5-safe/Cargo.toml --locked --all-targets
          python3 simulation/fortune5-safe/scripts/verify.py --require-cargo
          test -s simulation/fortune5-safe/target/aps-safe-sim/verification-receipt.json
      - name: Verify all canonical APS profiles and WIP closure
        shell: bash
        run: |
          set -euo pipefail
          cp receipts/APS-v26.7.31-ggen-standard.json /tmp/expected-ggen.json
          cp receipts/APS-v26.7.31-ggen-enterprise-architecture.json /tmp/expected-ea.json
          python3 specification-guide/scripts/verify_ggen_v26_7_31.py
          python3 specification-guide/scripts/verify_ea_strategy_v26_7_31.py
          cmp /tmp/expected-ggen.json receipts/APS-v26.7.31-ggen-standard.json
          cmp /tmp/expected-ea.json receipts/APS-v26.7.31-ggen-enterprise-architecture.json
          python3 specification-guide/scripts/verify_v26_7_31.py
          python3 specification-guide/scripts/verify_wip_closure_v26_7_31.py
      - name: Install publication dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v mdbook >/dev/null || cargo install mdbook --version 0.5.4 --locked
          command -v mdbook-pdf >/dev/null || cargo install mdbook-pdf --version 0.1.13 --locked
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          chrome=$(command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          test -n "$chrome"
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          mdbook --version
      - name: Build HTML and PDF projections
        shell: bash
        run: |
          set -euo pipefail
          rm -rf specification-guide/book
          mdbook build specification-guide 2>&1 | tee /tmp/APS-v26.7.31-mdbook-build.log
          test -s specification-guide/book/html/print.html
          test -s specification-guide/book/pdf/output.pdf
          mkdir -p specification-guide/dist
          cp specification-guide/book/pdf/output.pdf specification-guide/dist/APS-v26.7.31.pdf
          pdf=specification-guide/dist/APS-v26.7.31.pdf
          test "$(head -c 4 "$pdf")" = '%PDF'
          pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
          bytes=$(stat -c '%s' "$pdf")
          test "$pages" -ge 25
          test "$bytes" -ge 250000
          echo "APS_PDF_PAGES=$pages" >> "$GITHUB_ENV"
          echo "APS_PDF_BYTES=$bytes" >> "$GITHUB_ENV"
      - name: Manufacture exact-head publication receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess
          pdf = Path("specification-guide/dist/APS-v26.7.31.pdf")
          evidence_paths = [
              Path("receipts/APS-v26.7.31-ggen-standard.json"),
              Path("receipts/APS-v26.7.31-ggen-enterprise-architecture.json"),
              Path("receipts/APS-v26.7.31-book-verifier.json"),
              Path("receipts/APS-v26.7.31-wip-closure.json"),
              Path("simulation/fortune5-safe/target/aps-safe-sim/verification-receipt.json"),
              Path("simulation/fortune5-safe/target/aps-safe-sim/simulation-report.json"),
              Path("simulation/fortune5-safe/target/aps-safe-sim/self-test.json"),
          ]
          for path in evidence_paths:
              if not path.exists(): raise SystemExit(f"PUBLICATION_EVIDENCE_MISSING:{path}")
          evidence = {str(path): {"sha256": hashlib.sha256(path.read_bytes()).hexdigest(), "bytes": path.stat().st_size} for path in evidence_paths}
          receipt = {
              "schema": "aps.exact-head-publication.receipt.v26.7.31",
              "standing": "ALIVE",
              "subject": os.environ["APS_SOURCE_REVISION"],
              "repository": "seanchatmangpt/agile-protocol-specification",
              "topology": {"topLevelChapters": 18, "totalChapters": 19},
              "ggen": {
                  "release": "26.7.62",
                  "sourceRevision": "68952593c40214ac1a681073d65f3902a9cdfce4",
                  "directActuationAllowed": False,
                  "executionReceiptAlgorithm": "BLAKE3",
              },
              "enterpriseArchitecture": {"dimensions": 21, "proofObligations": 63, "stage5IsOriginalRwr": False},
              "toolchain": {
                  "rustc": subprocess.check_output(["rustc", "--version"], text=True).strip(),
                  "cargo": subprocess.check_output(["cargo", "--version"], text=True).strip(),
                  "python": subprocess.check_output(["python3", "--version"], text=True).strip(),
                  "mdbook": subprocess.check_output(["mdbook", "--version"], text=True).strip(),
                  "mdbookPdf": "0.1.13",
              },
              "evidence": evidence,
              "pdf": {
                  "path": str(pdf), "sha256": hashlib.sha256(pdf.read_bytes()).hexdigest(),
                  "pages": int(os.environ["APS_PDF_PAGES"]), "bytes": int(os.environ["APS_PDF_BYTES"]),
              },
              "zeroUnreceiptedActuation": True,
              "repositoryMutation": False,
              "replay": [
                  "python3 simulation/fortune5-safe/scripts/verify.py --require-cargo",
                  "python3 specification-guide/scripts/verify_ggen_v26_7_31.py",
                  "python3 specification-guide/scripts/verify_ea_strategy_v26_7_31.py",
                  "python3 specification-guide/scripts/verify_v26_7_31.py",
                  "python3 specification-guide/scripts/verify_wip_closure_v26_7_31.py",
                  "mdbook build specification-guide",
              ],
              "nonclaims": [
                  "No production MCP, A2A, ggen, or BRCE endpoint was deployed.",
                  "The workflow artifact is not a release promotion grant.",
                  "No real Fortune-5 company is represented.",
                  "No generated output was pushed to the candidate branch.",
              ],
          }
          Path("receipts/APS-v26.7.31-exact-head-publication.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY
      - name: Refuse canonical-source mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            .aps-syntax.md README.md APS_V26_7_31_RELEASE_NOTES.md \
            specification-guide/src specification-guide/scripts specification-guide/standards \
            simulation/fortune5-safe/src simulation/fortune5-safe/tests simulation/fortune5-safe/config \
            .github/workflows
      - name: Upload immutable publication evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: APS-v26.7.31-exact-head-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            specification-guide/book/html/
            specification-guide/dist/APS-v26.7.31.pdf
            receipts/APS-v26.7.31-*.json
            simulation/fortune5-safe/target/aps-safe-sim/
            /tmp/APS-v26.7.31-mdbook-build.log
          if-no-files-found: error
          retention-days: 30
